<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แจ้งหยุดงาน - TaxiEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand-dark: #13444B;
            --brand-mid: #1A5C65;
            --brand-light: #4EB1B3;
            --brand-pale: #E8F6F6;
            --bg: #F0F4F4;
            --surface: #FFFFFF;
            --text-primary: #1A2C2E;
            --text-secondary: #5A7A7D;
            --text-muted: #8FA8AB;
            --border: #D8E4E5;
            --warning: #E8A817;
            --danger: #D94052;
            --danger-mid: #C0384A;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(19,68,75,0.06);
            --shadow-md: 0 4px 12px rgba(19,68,75,0.08);
            --shadow-lg: 0 8px 24px rgba(19,68,75,0.10);
        }

        body {
            background-color: var(--bg);
            font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 48px;
        }

        /* ─── Header ─── */
        .header {
            background: linear-gradient(160deg, var(--brand-dark) 0%, var(--brand-mid) 50%, var(--brand-light) 100%);
            color: #fff;
            padding: 28px 24px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -15%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .header-sub {
            font-size: 0.78rem;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        /* ─── Container ─── */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ─── Loader ─── */
        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--danger);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Driver Card ─── */
        .driver-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: -28px;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeUp 0.4s ease both;
        }
        .driver-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .driver-plate {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ─── Form Sections ─── */
        .form-section {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-top: 14px;
            box-shadow: var(--shadow-sm);
            animation: fadeUp 0.4s ease both;
        }
        .form-section:nth-child(2) { animation-delay: 0.05s; }
        .form-section:nth-child(3) { animation-delay: 0.1s; }
        .form-section:nth-child(4) { animation-delay: 0.15s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── Radio Toggle ─── */
        .toggle-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .toggle-option {
            position: relative;
        }
        .toggle-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-label {
            display: block;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--bg);
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-option input[type="radio"]:checked + .toggle-label {
            border-color: var(--brand-light);
            background: var(--brand-pale);
            color: var(--brand-dark);
            font-weight: 600;
        }
        .toggle-option input[type="radio"]:focus-visible + .toggle-label {
            box-shadow: 0 0 0 3px rgba(78,177,179,0.25);
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        /* ─── Inputs ─── */
        .input-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            -webkit-appearance: none;
        }
        .input-field::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .input-field:focus {
            border-color: var(--brand-light);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(78,177,179,0.12);
        }
        .input-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 4px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            transition: grid-template-columns 0.3s;
        }
        .date-row.multi {
            grid-template-columns: 1fr 1fr;
        }

        /* ─── Submit Button ─── */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--danger), var(--danger-mid));
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: var(--shadow-md);
            animation: fadeUp 0.4s ease both;
            animation-delay: 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        /* ─── Status Cards ─── */
        .status-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            margin-top: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeUp 0.4s ease both;
        }
        .status-card.danger  { border-top: 4px solid var(--danger); }
        .status-card.warning { border-top: 4px solid var(--warning); }
        .status-icon { font-size: 2rem; margin-bottom: 12px; }
        .status-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
        .status-title.danger  { color: var(--danger); }
        .status-title.warning { color: var(--warning); }
        .status-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .status-desc strong { color: var(--brand-dark); }
        .error-text {
            text-align: center;
            color: var(--danger);
            font-weight: 600;
            padding: 40px 20px;
            font-size: 0.9rem;
        }

        /* ─── Utility ─── */
        .hidden { display: none !important; }

        @media (prefers-reduced-motion: reduce) {
            .driver-card, .form-section, .btn-submit, .status-card { animation: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">แจ้งหยุดงาน / ลาพัก</div>
        <div class="header-sub">ข้อมูลจะถูกบันทึกลงปฏิทินอัตโนมัติ</div>
    </div>

    <div class="container">

        <!-- Loader -->
        <div id="loader" class="loader-wrap">
            <div class="spinner"></div>
        </div>

        <!-- Leave Form -->
        <div id="leaveForm" class="hidden">

            <!-- Driver Card -->
            <div class="driver-card">
                <div class="driver-name" id="driverName">...</div>
                <div class="driver-plate" id="driverPlate">...</div>
                <input type="hidden" id="uid">
                <input type="hidden" id="name">
                <input type="hidden" id="plate">
                <input type="hidden" id="type">
            </div>

            <form id="form">

                <!-- Leave Type -->
                <div class="form-section">
                    <div class="section-label">รูปแบบการหยุด</div>
                    <div class="toggle-group">
                        <div class="toggle-option">
                            <input type="radio" name="leaveType" id="leaveOne" value="1" checked onchange="toggleLeaveType()">
                            <label class="toggle-label" for="leaveOne">หยุด 1 วัน</label>
                        </div>
                        <div class="toggle-option">
                            <input type="radio" name="leaveType" id="leaveMultiple" value="M" onchange="toggleLeaveType()">
                            <label class="toggle-label" for="leaveMultiple">หยุดหลายวัน</label>
                        </div>
                    </div>
                </div>

                <!-- Dates -->
                <div class="form-section">
                    <div class="date-row" id="dateRow">
                        <div>
                            <label class="input-label" id="startDateLabel" for="start_date">วันที่หยุด</label>
                            <input type="date" id="start_date" class="input-field" required>
                        </div>
                        <div id="endDateGroup" class="hidden">
                            <label class="input-label" for="end_date">ถึงวันที่</label>
                            <input type="date" id="end_date" class="input-field">
                        </div>
                    </div>
                </div>

                <!-- Reason -->
                <div class="form-section">
                    <label class="input-label" for="leave_reason">เหตุผลการหยุด <span class="input-hint">(ไม่ระบุได้)</span></label>
                    <input type="text" id="leave_reason" class="input-field" placeholder="เช่น ธุระส่วนตัว, รถซ่อม">
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">บันทึกวันหยุด</button>
            </form>
        </div>
    </div>

    <script>
        const LIFF_ID = "2009451309-801yZvQM";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzuh0khDmnAU624NO5a6LSLFDhp0-k-9VROw-ETyqE2wcn9c3f2tv0lLDA7ONfu17SI/exec";

        async function main() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            document.getElementById('uid').value = profile.userId;

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const today = `${yyyy}-${mm}-${dd}`;
            document.getElementById('start_date').value = today;
            document.getElementById('end_date').value = today;

            checkUser(profile.userId);
        }

        function toggleLeaveType() {
            const isMultiple = document.getElementById('leaveMultiple').checked;
            const endGroup = document.getElementById('endDateGroup');
            const dateRow = document.getElementById('dateRow');

            if (isMultiple) {
                endGroup.classList.remove('hidden');
                dateRow.classList.add('multi');
                document.getElementById('startDateLabel').innerText = 'เริ่มหยุดวันที่';
                document.getElementById('end_date').setAttribute('required', 'true');
            } else {
                endGroup.classList.add('hidden');
                dateRow.classList.remove('multi');
                document.getElementById('startDateLabel').innerText = 'วันที่หยุด';
                document.getElementById('end_date').removeAttribute('required');
            }
        }

        async function checkUser(userId) {
            try {
                const res = await fetch(`${GAS_URL}?uid=${userId}`);
                const data = await res.json();

                if (data.status === "success") {
                    document.getElementById('driverName').innerText = data.name;
                    if (document.getElementById('driverPlate')) document.getElementById('driverPlate').innerText = data.plate;
                    if (document.getElementById('name')) document.getElementById('name').value = data.name;
                    if (document.getElementById('plate')) document.getElementById('plate').value = data.plate;
                    if (document.getElementById('type')) document.getElementById('type').value = data.type;

                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('leaveForm').classList.remove('hidden');

                } else if (data.status === "suspended") {
                    document.getElementById('leaveForm').classList.add('hidden');
                    document.getElementById('loader').innerHTML = `
                        <div class="status-card danger">
                            <div class="status-icon">🚫</div>
                            <div class="status-title danger">บัญชีถูกระงับ</div>
                            <p class="status-desc">ผู้ใช้ถูกระงับการใช้งาน<br>กรุณาติดต่อแอดมินหรือผู้ดูแลระบบครับ</p>
                        </div>
                    `;
                } else {
                    document.getElementById('leaveForm').classList.add('hidden');
                    document.getElementById('loader').innerHTML = `
                        <div class="status-card warning">
                            <div class="status-icon">⚠️</div>
                            <div class="status-title warning">ไม่มีสิทธิ์เข้าใช้งาน</div>
                            <p class="status-desc">บัญชีของคุณยังไม่ได้รับการอนุมัติ<br><br>กรุณาไปที่เมนู <strong>"ส่งยอดรายวัน"</strong><br>เพื่อคัดลอกรหัส UID ส่งให้แอดมินครับ</p>
                        </div>
                    `;
                }
            } catch (err) {
                document.getElementById('loader').innerHTML = `<p class="error-text">เชื่อมต่อเซิร์ฟเวอร์ผิดพลาด</p>`;
            }
        }

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "กำลังบันทึก...";

            const isMultiple = document.getElementById('leaveMultiple').checked;
            const startDate = document.getElementById('start_date').value;
            const endDate = isMultiple ? document.getElementById('end_date').value : startDate;

            let reasonInput = document.getElementById('leave_reason').value.trim();
            if (reasonInput === "") { reasonInput = "ไม่ได้ระบุเหตุผล"; }

            const payload = {
                status: "หยุดงาน",
                uid: document.getElementById('uid').value,
                name: document.getElementById('name').value,
                plate: document.getElementById('plate').value,
                type: document.getElementById('type').value,
                start_date: startDate,
                end_date: endDate,
                leave_reason: reasonInput
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    alert("บันทึกวันหยุดสำเร็จ");
                    liff.closeWindow();
                }
            } catch (err) {
                alert("ขัดข้อง ลองใหม่ครับ");
            }
            btn.disabled = false;
            btn.innerText = "บันทึกวันหยุด";
        };

        main();
    </script>
</body>
</html>
