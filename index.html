<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ส่งยอดรายวัน - TaxiEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand-dark: #13444B;
            --brand-mid: #1A5C65;
            --brand-light: #4EB1B3;
            --brand-pale: #E8F6F6;
            --bg: #F0F4F4;
            --surface: #FFFFFF;
            --text-primary: #1A2C2E;
            --text-secondary: #5A7A7D;
            --text-muted: #8FA8AB;
            --border: #D8E4E5;
            --warning: #E8A817;
            --warning-bg: #FFF8E7;
            --success: #1D9E6F;
            --success-bg: #E6F7F0;
            --danger: #D94052;
            --danger-bg: #FDE8EA;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(19,68,75,0.06);
            --shadow-md: 0 4px 12px rgba(19,68,75,0.08);
            --shadow-lg: 0 8px 24px rgba(19,68,75,0.10);
        }

        body {
            background-color: var(--bg);
            font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            padding-bottom: 48px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ─── Header ─── */
        .header {
            background: linear-gradient(160deg, var(--brand-dark) 0%, var(--brand-mid) 50%, var(--brand-light) 100%);
            color: #fff;
            padding: 32px 24px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -15%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        .header-sub {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 3px;
            margin-top: 2px;
            position: relative;
            z-index: 1;
        }

        /* ─── Container ─── */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ─── Driver Card ─── */
        .driver-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: -28px;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .driver-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .driver-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: inherit;
        }
        .badge-plate {
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .badge-type {
            background: var(--brand-pale);
            color: var(--brand-dark);
        }

        /* ─── Form Sections ─── */
        .form-section {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-top: 14px;
            box-shadow: var(--shadow-sm);
            animation: fadeUp 0.4s ease both;
        }
        .form-section:nth-child(2) { animation-delay: 0.05s; }
        .form-section:nth-child(3) { animation-delay: 0.1s; }
        .form-section:nth-child(4) { animation-delay: 0.15s; }
        .form-section:nth-child(5) { animation-delay: 0.2s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .section-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .section-icon.app    { background: var(--brand-pale); }
        .section-icon.outside{ background: var(--warning-bg); }
        .section-icon.airport{ background: var(--success-bg); }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ─── Inputs ─── */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .input-grid .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            position: relative;
        }
        .input-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            -webkit-appearance: none;
        }
        .input-field::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .input-field:focus {
            border-color: var(--brand-light);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(78,177,179,0.12);
        }

        /* date input */
        input[type="date"].input-field {
            color: var(--text-primary);
        }

        /* ─── Submit Button ─── */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--brand-dark), var(--brand-mid));
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: var(--shadow-md);
            letter-spacing: 0.3px;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* ─── Loader ─── */
        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--brand-light);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ─── Status Cards (suspended / not registered) ─── */
        .status-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            margin-top: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeUp 0.4s ease both;
        }
        .status-card.danger  { border-top: 4px solid var(--danger); }
        .status-card.warning { border-top: 4px solid var(--warning); }

        .status-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .status-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .status-title.danger  { color: var(--danger); }
        .status-title.warning { color: var(--warning); }

        .status-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .uid-box {
            background: var(--bg);
            border: 1.5px dashed var(--brand-light);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin: 18px 0;
            word-break: break-all;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--brand-dark);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .btn-copy {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--warning);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }
        .btn-copy:active { transform: scale(0.98); }

        .error-text {
            text-align: center;
            color: var(--danger);
            font-weight: 600;
            padding: 40px 20px;
            font-size: 0.9rem;
        }

        /* ─── Utility ─── */
        .hidden { display: none !important; }

        /* ─── Reduce motion ─── */
        @media (prefers-reduced-motion: reduce) {
            .form-section, .status-card { animation: none; }
            .btn-submit { transition: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-logo">TAXI EV</div>
        <div class="header-sub">CHIANG MAI</div>
    </div>

    <div class="container">

        <!-- Loader -->
        <div id="loader" class="loader-wrap">
            <div class="spinner"></div>
            <div class="loader-text">กำลังตรวจสอบข้อมูล...</div>
        </div>

        <!-- Main Form -->
        <form id="reportForm" class="hidden">

            <!-- Driver Card -->
            <div class="driver-card">
                <div class="driver-name" id="driverName">...</div>
                <div class="driver-badges">
                    <span class="badge badge-plate" id="driverPlate">...</span>
                    <span class="badge badge-type" id="driverType">...</span>
                </div>
                <input type="hidden" id="uid">
                <input type="hidden" id="name">
                <input type="hidden" id="plate">
                <input type="hidden" id="type">
            </div>

            <!-- Date -->
            <div class="form-section">
                <div class="input-group">
                    <label class="input-label" for="report_date">วันที่ส่งยอด</label>
                    <input type="date" id="report_date" class="input-field" required>
                </div>
            </div>

            <!-- App Income -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-icon app">📱</div>
                    <div class="section-title">รายได้จากแอปพลิเคชัน</div>
                </div>
                <div class="input-grid">
                    <div class="input-group">
                        <label class="input-label" for="grab">Grab</label>
                        <input type="number" id="grab" class="input-field" placeholder="0" step="any">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="bolt">Bolt</label>
                        <input type="number" id="bolt" class="input-field" placeholder="0" step="any">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="maxim">Maxim</label>
                        <input type="number" id="maxim" class="input-field" placeholder="0" step="any">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="indriver">InDriver</label>
                        <input type="number" id="indriver" class="input-field" placeholder="0" step="any">
                    </div>
                    <div class="input-group full-width">
                        <label class="input-label" for="lineman">LINE MAN</label>
                        <input type="number" id="lineman" class="input-field" placeholder="0" step="any">
                    </div>
                </div>
            </div>

            <!-- Outside / Charter -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-icon outside">🚕</div>
                    <div class="section-title">งานนอกระบบ / เหมา</div>
                </div>
                <div class="input-grid">
                    <div class="input-group">
                        <label class="input-label" for="outside">งานนอก</label>
                        <input type="number" id="outside" class="input-field" placeholder="0" step="any">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="mao">งานเหมา</label>
                        <input type="number" id="mao" class="input-field" placeholder="0" step="any">
                    </div>
                    <div class="input-group full-width">
                        <label class="input-label" for="mao_location">สถานที่เหมา</label>
                        <input type="text" id="mao_location" class="input-field" placeholder="เช่น เชียงใหม่-ปาย">
                    </div>
                </div>
            </div>

            <!-- Airport (conditional) -->
            <div class="form-section hidden" id="airportSection">
                <div class="section-header">
                    <div class="section-icon airport">✈️</div>
                    <div class="section-title">งานสนามบิน</div>
                </div>
                <div class="input-group">
                    <label class="input-label" for="airport_calc">ยอดสนามบิน (ใส่สูตรได้)</label>
                    <input type="text" id="airport_calc" class="input-field" placeholder="เช่น 150*6+200*3+350">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">ส่งยอดรายวัน</button>
        </form>
    </div>

    <script>
        const LIFF_ID = "2009451309-J0G2WohH";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzuh0khDmnAU624NO5a6LSLFDhp0-k-9VROw-ETyqE2wcn9c3f2tv0lLDA7ONfu17SI/exec";

        async function main() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            document.getElementById('uid').value = profile.userId;
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('report_date').value = `${yyyy}-${mm}-${dd}`;
            checkUser(profile.userId);
        }

        async function checkUser(uid) {
            try {
                const res = await fetch(`${GAS_URL}?uid=${uid}`);
                const data = await res.json();

                if (data.status === "success") {
                    document.getElementById('driverName').innerText = data.name;
                    document.getElementById('driverPlate').innerText = data.plate;
                    document.getElementById('driverType').innerText = data.type;
                    document.getElementById('name').value = data.name;
                    document.getElementById('plate').value = data.plate;
                    document.getElementById('type').value = data.type;

                    if (data.type === "สนามบิน") {
                        document.getElementById('airportSection').classList.remove('hidden');
                    }

                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('reportForm').classList.remove('hidden');

                } else if (data.status === "suspended") {
                    document.getElementById('reportForm').classList.add('hidden');
                    document.getElementById('loader').innerHTML = `
                        <div class="status-card danger">
                            <div class="status-icon">🚫</div>
                            <div class="status-title danger">บัญชีถูกระงับ</div>
                            <p class="status-desc">ผู้ใช้ถูกระงับการใช้งาน<br>กรุณาติดต่อแอดมินหรือผู้ดูแลระบบครับ</p>
                        </div>
                    `;
                } else {
                    document.getElementById('reportForm').classList.add('hidden');
                    document.getElementById('loader').innerHTML = `
                        <div class="status-card warning">
                            <div class="status-icon">⚠️</div>
                            <div class="status-title warning">ไม่มีสิทธิ์เข้าใช้งาน</div>
                            <p class="status-desc">บัญชีของคุณยังไม่ได้รับการอนุมัติ<br>กรุณาคัดลอก UID ด้านล่างส่งให้แอดมินครับ</p>
                            <div class="uid-box">${uid}</div>
                            <button class="btn-copy" onclick="copyMyUID('${uid}')">📋 คัดลอก UID ส่งให้แอดมิน</button>
                        </div>
                    `;
                }
            } catch (err) {
                document.getElementById('loader').innerHTML = `<p class="error-text">เชื่อมต่อเซิร์ฟเวอร์ผิดพลาด</p>`;
            }
        }

        function copyMyUID(uidText) {
            var tempInput = document.createElement("textarea");
            tempInput.value = uidText;
            tempInput.setAttribute("readonly", "");
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            try {
                document.execCommand("copy");
                alert("📋 คัดลอก UID สำเร็จ!\nนำไปกดยืนยันส่งในแชทให้แอดมินได้เลยครับ");
            } catch (err) {
                alert("ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาคลุมดำที่ตัวอักษรแล้วกดคัดลอกเองนะครับ");
            }
            document.body.removeChild(tempInput);
        }

        document.getElementById('reportForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');

            const maoValue = Number(document.getElementById('mao').value) || 0;
            const maoLoc = document.getElementById('mao_location').value.trim();
            if (maoValue > 0 && maoLoc === "") {
                alert("⚠️ กรุณาระบุ 'สถานที่เหมา' ด้วยครับ (เนื่องจากมีการกรอกยอดงานเหมา)");
                document.getElementById('mao_location').focus();
                return;
            }

            btn.disabled = true;
            btn.innerText = "กำลังบันทึก...";

            const payload = {
                uid: document.getElementById('uid').value,
                name: document.getElementById('name').value,
                plate: document.getElementById('plate').value,
                type: document.getElementById('type').value,
                report_date: document.getElementById('report_date').value,
                grab: document.getElementById('grab').value,
                bolt: document.getElementById('bolt').value,
                maxim: document.getElementById('maxim').value,
                indriver: document.getElementById('indriver').value,
                lineman: document.getElementById('lineman').value,
                outside: document.getElementById('outside').value,
                mao: document.getElementById('mao').value,
                mao_location: document.getElementById('mao_location').value,
                airport_calc: document.getElementById('airport_calc').value
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    alert("บันทึกยอดสำเร็จ กรุณาแนบสลิปในแชทครับ");
                    liff.closeWindow();
                } else {
                    alert("เกิดข้อผิดพลาด: " + result.message);
                    btn.disabled = false;
                    btn.innerText = "ส่งยอดรายวัน";
                }
            } catch (err) {
                alert("ส่งข้อมูลไม่สำเร็จ");
                btn.disabled = false;
                btn.innerText = "ส่งยอดรายวัน";
            }
        };

        main();
    </script>
</body>
</html>
