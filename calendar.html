<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ตารางวันหยุด - TaxiEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand-dark: #13444B;
            --brand-mid: #1A5C65;
            --brand-light: #4EB1B3;
            --brand-pale: #E8F6F6;
            --bg: #F0F4F4;
            --surface: #FFFFFF;
            --text-primary: #1A2C2E;
            --text-secondary: #5A7A7D;
            --text-muted: #8FA8AB;
            --border: #D8E4E5;
            --warning: #E8A817;
            --warning-bg: #FFF8E7;
            --success: #1D9E6F;
            --success-bg: #E6F7F0;
            --danger: #D94052;
            --danger-bg: #FDE8EA;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(19,68,75,0.06);
            --shadow-md: 0 4px 12px rgba(19,68,75,0.08);
            --shadow-lg: 0 8px 24px rgba(19,68,75,0.10);
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg);
            font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ─── Header ─── */
        .header {
            background: linear-gradient(160deg, var(--brand-dark) 0%, var(--brand-mid) 50%, var(--brand-light) 100%);
            color: #fff;
            padding: 28px 24px 44px;
            text-align: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -15%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header-sub {
            font-size: 0.78rem;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        /* ─── Loader ─── */
        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            flex-grow: 1;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--brand-light);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ─── Calendar Container ─── */
        .calendar-container {
            flex-grow: 1;
            padding: 0 16px 16px;
            margin-top: -24px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.4s ease both;
        }
        .calendar-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .calendar-card iframe {
            flex-grow: 1;
            width: 100%;
            min-height: 500px;
            border: none;
            display: block;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── Status Cards ─── */
        .status-wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
            width: 100%;
        }
        .status-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            margin-top: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeUp 0.4s ease both;
        }
        .status-card.danger  { border-top: 4px solid var(--danger); }
        .status-card.warning { border-top: 4px solid var(--warning); }

        .status-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .status-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .status-title.danger  { color: var(--danger); }
        .status-title.warning { color: var(--warning); }

        .status-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .status-desc strong {
            color: var(--brand-dark);
        }

        .error-text {
            text-align: center;
            color: var(--danger);
            font-weight: 600;
            padding: 40px 20px;
            font-size: 0.9rem;
        }

        /* ─── Utility ─── */
        .hidden { display: none !important; }

        @media (prefers-reduced-motion: reduce) {
            .calendar-container, .status-card { animation: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">📅 ตารางวันหยุด / ลาพัก</div>
        <div class="header-sub">ตรวจสอบคิวหยุดของเพื่อนร่วมงาน</div>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-wrap">
        <div class="spinner"></div>
        <div class="loader-text">กำลังตรวจสอบสิทธิ์...</div>
    </div>

    <!-- Calendar -->
    <div id="calendarContent" class="hidden" style="flex-grow:1; display:flex; flex-direction:column;">
        <div class="calendar-container">
            <div class="calendar-card">
                <iframe src="https://calendar.google.com/calendar/embed?src=b98afce7545711ef3d92851d14979ca45e378c7b563dcd9acc8cbddeca8ef3bb%40group.calendar.google.com&ctz=Asia%2FBangkok" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2009451309-BayFaObk";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzuh0khDmnAU624NO5a6LSLFDhp0-k-9VROw-ETyqE2wcn9c3f2tv0lLDA7ONfu17SI/exec";
        let userUid = "";

        async function main() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            userUid = (await liff.getProfile()).userId;
            checkUser(userUid);
        }

        async function checkUser(userId) {
            try {
                const res = await fetch(`${GAS_URL}?uid=${userId}`);
                const data = await res.json();

                if (data.status === "success") {
                    document.getElementById('loader').classList.add('hidden');
                    const cal = document.getElementById('calendarContent');
                    cal.classList.remove('hidden');
                    cal.style.display = 'flex';

                } else if (data.status === "suspended") {
                    document.getElementById('loader').innerHTML = `
                        <div class="status-wrap">
                            <div class="status-card danger">
                                <div class="status-icon">🚫</div>
                                <div class="status-title danger">บัญชีถูกระงับ</div>
                                <p class="status-desc">ผู้ใช้ถูกระงับการใช้งาน<br>กรุณาติดต่อแอดมินหรือผู้ดูแลระบบครับ</p>
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('loader').innerHTML = `
                        <div class="status-wrap">
                            <div class="status-card warning">
                                <div class="status-icon">⚠️</div>
                                <div class="status-title warning">ไม่มีสิทธิ์เข้าใช้งาน</div>
                                <p class="status-desc">บัญชีของคุณยังไม่ได้รับการอนุมัติ<br><br>กรุณาไปที่เมนู <strong>"ส่งยอดรายวัน"</strong><br>เพื่อคัดลอกรหัส UID ส่งให้แอดมินครับ</p>
                            </div>
                        </div>
                    `;
                }
            } catch(err) {
                document.getElementById('loader').innerHTML = `<p class="error-text">เชื่อมต่อเซิร์ฟเวอร์ผิดพลาด</p>`;
            }
        }

        window.onload = main;
    </script>
</body>
</html>
